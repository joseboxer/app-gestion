# Nginx - App Gestión en subcarpeta (gofix.space/app-gestion/)
# Incluir dentro del server {} de gofix.space
# Ruta: /var/www/gofix/app-gestion/

# Panel Web - usar root en lugar de alias (evita 403)
location /app-gestion/ {
    root /var/www/gofix;
    index index.html;
    try_files $uri $uri/ /app-gestion/index.html;
}

# API (proxy al backend Node.js)
location /app-gestion/api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
