# Nginx - App Gestión en subcarpeta (VPS)
# Incluir dentro de tu bloque server {}
# Ruta: /var/www/gofix/app-gestion/

# Si da 403:
# 1. Ruta existe: ls -la /var/www/gofix/app-gestion/ (debe haber index.html)
# 2. Permisos: sudo chown -R www-data:www-data /var/www/gofix
# 3. chmod: sudo chmod -R 755 /var/www/gofix

# Panel Web (SPA en /app-gestion/)
location /app-gestion/ {
    alias /var/www/gofix/app-gestion/;
    index index.html;
    try_files $uri $uri/ /app-gestion/index.html;
}

# API (proxy al backend Node.js)
location /app-gestion/api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
